<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Adaptive AI Powered Signal Overlay</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        .website-frame {
            width: 100%;
            height: 100%;
            border: none;
        }
        .overlay-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 40px;
            z-index: 99999;
            display: none;
        }
        .lock-popup-container {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 160px;
            z-index: 100000;
            cursor: grab;
            user-select: none;
            touch-action: none;
        }
        .lock-box {
            background: #000;
            border: 2px solid #ff0066;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 0 15px rgba(255, 0, 102, 0.9);
            color: #fff;
        }
        .lock-icon {
            background: #0b1315;
            border: 1px solid #00ffcc;
            width: 35px;
            height: 35px;
            margin: 0 auto 10px auto;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
        }
        .lock-title {
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 0.5px;
            color: #00ffcc;
        }
        .lock-subtitle {
            font-size: 8px;
            font-weight: bold;
            color: #ff0066;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }
        .lock-input {
            width: 90%;
            padding: 6px;
            border: 1px solid #00ffcc;
            border-radius: 6px;
            background: #0b1315;
            color: #fff;
            font-size: 11px;
            text-align: center;
            margin-bottom: 12px;
            outline: none;
        }
        .btn-group {
            display: flex;
            justify-content: space-between;
            gap: 6px;
        }
        .btn {
            flex: 1;
            padding: 6px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 10px;
        }
        .btn-execute {
            background: #ff0066;
            color: #fff;
            border: 1px solid #ff0066;
        }
        .btn-hide {
            background: #0b1315;
            color: #00ffcc;
            border: 1px solid #00ffcc;
        }
        .floating-fh-ball, .floating-ei-ball {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: #000;
            border-radius: 50%;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 15px rgba(255, 0, 102, 0.9);
            z-index: 100001;
            cursor: grab;
            user-select: none;
            touch-action: none;
            pointer-events: auto;
        }
        .floating-fh-ball { border: 2px solid #ff0066; }
        .floating-ei-ball { border: 2px solid #00ffcc; }
        .ball-text { font-size: 11px; font-weight: bold; color: #fff; }
        .ball-bar { width: 25px; height: 2px; background: #00ffcc; margin-top: 2px; }

        .floating-history-ball {
            position: fixed;
            top: 80px;
            right: 30px;
            width: 30px;
            height: 30px;
            background: #000;
            border: 2px solid #ff0066;
            border-radius: 50%;
            display: none;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 12px rgba(255, 0, 102, 0.8);
            z-index: 100001;
            user-select: none;
            pointer-events: auto;
            color: #00ffcc;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }
        .history-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 340px;
            height: 380px;
            background: #000;
            border: 2px solid #ff0066;
            border-radius: 12px;
            z-index: 100005;
            display: none;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(255, 0, 102, 0.8);
            color: #fff;
            overflow: hidden;
        }
        .history-header {
            background: #00ffcc;
            color: #000;
            font-weight: bold;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            padding: 8px 12px;
            align-items: center;
        }
        .history-close { cursor: pointer; font-size: 14px; font-weight: bold; }
        .history-table-container { width: 100%; height: calc(380px - 33px); overflow-y: auto; }
        .history-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        .history-table th {
            background: #ffcc00;
            color: #000;
            font-size: 10px;
            padding: 6px 2px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 2;
        }
        .history-table td {
            font-size: 10px;
            height: 32px;
            padding: 4px 2px;
            text-align: center;
            border-bottom: 1px solid #222;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .signal-box-wrapper {
            position: relative;
            width: 340px;
            height: 200px;
            pointer-events: auto;
            display: flex;
            justify-content: center;
        }
        .box {
            position: absolute;
            background: #0b1315;
            border: 2px solid #00ffcc;
            border-radius: 10px;
            color: #fff;
            text-align: center;
            box-shadow: 0 0 12px rgba(0, 255, 204, 0.4);
        }
        .box-title { font-size: 8px; letter-spacing: 1px; color: #8ceade; margin-bottom: 2px; font-weight: bold; }
        .timer-box { top: 0px; left: 70%; transform: translateX(-50%); width: 90px; padding: 6px; }
        .timer-value { font-size: 13px; font-weight: bold; color: #fff; }
        .timer-bar-container { width: 100%; height: 3px; background: #222; margin-top: 4px; border-radius: 2px; overflow: hidden; }
        .timer-bar { height: 100%; background: #00ffcc; width: 100%; transition: width 1s linear; }
        .new-period-box { top: 0px; left: 25%; transform: translateX(-50%); width: 115px; padding: 6px 2px; }
        .new-period-value { font-size: 11px; font-weight: bold; color: #ffcc00; margin-top: 2px; }
        
        .signal-center {
            top: 55px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            padding: 8px 4px;
        }
        .signal-value { font-size: 16px; font-weight: bold; margin-top: 3px; }

        .center-circle {
            position: absolute;
            top: 110px;
            left: 50%;
            transform: translateX(-50%);
            width: 55px;
            height: 55px;
            background: #000;
            border: 3px solid #ff0066;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 15px rgba(255, 0, 102, 0.9);
            z-index: 20;
            cursor: pointer;
        }
        .circle-text { font-size: 10px; font-weight: bold; color: #fff; }
        .circle-bar { width: 25px; height: 2px; background: #00ffcc; margin-top: 2px; }
    </style>
</head>
<body>

    <iframe src="https://dkwin9.com/" class="website-frame"></iframe>

    <div class="lock-popup-container" id="lockPopup">
        <div class="lock-box">
            <div class="lock-icon">🔒</div>
            <div class="lock-title">ACCESS LOCKED</div>
            <div class="lock-subtitle">ENTER PASSWORD</div>
            <input type="password" id="accessKey" class="lock-input" placeholder="ACCESS KEY" value="12345">
            <div class="btn-group">
                <button class="btn btn-execute" onclick="checkPassword()">EXECUTE</button>
                <button class="btn btn-hide" onclick="hidePasswordLock()">HIDE</button>
            </div>
        </div>
    </div>

    <div class="floating-fh-ball" id="fhBall" onclick="handleFhBallClick()">
        <div class="ball-text">FH</div>
        <div class="ball-bar"></div>
    </div>

    <div class="floating-ei-ball" id="eiBall" onclick="handleEiBallClick()">
        <div class="ball-text">EI</div>
        <div class="ball-bar"></div>
    </div>

    <div class="floating-history-ball" id="historyBall" onclick="toggleHistoryModal()">H</div>

    <div class="history-modal" id="historyModal">
        <div class="history-header">
            <span>Signal History</span>
            <span class="history-close" onclick="toggleHistoryModal()">✕</span>
        </div>
        <div class="history-table-container">
            <table class="history-table">
                <thead>
                    <tr>
                        <th>Period</th>
                        <th>Signal</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="historyTableBody"></tbody>
            </table>
        </div>
    </div>

    <div class="overlay-container" id="signalOverlay">
        <div class="signal-box-wrapper" id="signalWrapper">
            <div class="box new-period-box">
                <div class="box-title">NEW PERIOD</div>
                <div class="new-period-value" id="newPeriodDisplay">---</div>
            </div>
            <div class="box timer-box">
                <div class="box-title">TIMER</div>
                <div class="timer-value" id="timerDisplay">30S</div>
                <div class="timer-bar-container">
                    <div class="timer-bar" id="timerBar"></div>
                </div>
            </div>

            <div class="box signal-center">
                <div class="box-title" id="signalBoxTitle">SIGNAL</div>
                <div class="signal-value" id="signalValue">SMALL</div>
            </div>

            <div class="center-circle" onclick="toggleSignalBoxes()">
                <div class="circle-text">HIDE</div>
                <div class="circle-bar"></div>
            </div>
        </div>
    </div>

    <script>
        let isUnlocked = false;
        let selectedTime = 30;
        let selectedApiType = 'WinGo_30S';
        let timerInterval = null;
        let lastGeneratedCycle = -1;
        let apiCheckedThisCycle = false;

        let currentSignal = { number: 0, size: 'Small', targetFullPeriod: '' };
        let apiBrainMemory = [];
        let mySignalHistory = [];

        function checkPassword() {
            let key = document.getElementById('accessKey').value;
            if (key === "12345") {
                isUnlocked = true;
                document.getElementById('lockPopup').style.display = 'none';
                document.getElementById('signalOverlay').style.display = 'flex';
                document.getElementById('signalWrapper').style.display = 'flex';
                document.getElementById('fhBall').style.display = 'none';
                document.getElementById('eiBall').style.display = 'none';
                document.getElementById('historyBall').style.display = 'none';
                startTimer(selectedTime);
                fetchAndUpdateNewPeriod(); 
            } else {
                alert("ভুল পাসওয়ার্ড! সঠিক পাসওয়ার্ড দিন।");
            }
        }

        function hidePasswordLock() {
            document.getElementById('lockPopup').style.display = 'none';
            document.getElementById('fhBall').style.display = 'flex';
        }

        function handleFhBallClick() {
            if (!hasMoved) {
                document.getElementById('lockPopup').style.display = 'block';
                document.getElementById('fhBall').style.display = 'none';
            }
        }

        function handleEiBallClick() {
            if (!hasMoved) { toggleSignalBoxes(); }
        }

        function toggleSignalBoxes() {
            const wrapper = document.getElementById('signalWrapper');
            const eiBall = document.getElementById('eiBall');
            const historyBall = document.getElementById('historyBall');
            
            if (wrapper.style.display === 'none') {
                wrapper.style.display = 'flex';
                eiBall.style.display = 'none';
                historyBall.style.display = 'none';
            } else {
                wrapper.style.display = 'none';
                eiBall.style.display = 'flex';
                historyBall.style.display = 'flex';
            }
        }

        function toggleHistoryModal() {
            const modal = document.getElementById('historyModal');
            if (modal.style.display === 'flex') {
                modal.style.display = 'none';
            } else {
                modal.style.display = 'flex';
                displayMyHistoryTable();
            }
        }

        function displayMyHistoryTable() {
            const tbody = document.getElementById('historyTableBody');
            if (mySignalHistory.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3">No History Yet</td></tr>';
                return;
            }
            let html = '';
            mySignalHistory.forEach(item => {
                let statusColor = item.status === 'Win' ? '#28a745' : '#dc3545';
                html += `<tr>
                    <td style="color:#fff; font-size:10px; text-align:center;">${item.period}</td>
                    <td style="font-weight:bold; font-size:12px; color:#00ffcc;">${item.signal}</td>
                    <td style="font-weight:bold; font-size:12px; color:${statusColor};">${item.status}</td>
                </tr>`;
            });
            tbody.innerHTML = html;
        }

        async function fetchAndUpdateNewPeriod() {
            const url = `https://draw.ar-lottery01.com/WinGo/${selectedApiType}/GetHistoryIssuePage.json`;
            try {
                let response = await fetch(url, { headers: { "Origin": "https://dkwin9.com", "Referer": "https://dkwin9.com/" } });
                let data = await response.json();
                apiBrainMemory = data.data.list; 
                let latestItem = apiBrainMemory[0];
                let latestPeriod = latestItem.issueNumber || latestItem.gameNo || latestItem.period || '';
                
                if (latestPeriod) {
                    let nextPeriod = String(BigInt(latestPeriod) + 1n);
                    currentSignal.targetFullPeriod = nextPeriod; 
                    document.getElementById('newPeriodDisplay').textContent = nextPeriod; 
                } else {
                    document.getElementById('newPeriodDisplay').textContent = "---";
                }
            } catch (error) {
                console.log("Period Fetch Error: ", error);
            }
        }

        // অ্যাডাপ্টিভ ও শক্তিশালী রিকভারি লজিক (লস ট্র্যাক করে ভালো রেজাল্ট জেনারেট করার জন্য)
        function generateJSSignal() {
            document.getElementById('signalBoxTitle').textContent = "SIGNAL";
            const signalValue = document.getElementById('signalValue');

            let predictedNum = Math.floor(Math.random() * 10);
            
            if (apiBrainMemory && apiBrainMemory.length > 0) {
                let lastNum = parseInt(apiBrainMemory[0].number || 0);
                let secondLast = parseInt(apiBrainMemory[1] ? apiBrainMemory[1].number : 3);
                
                // ডিফল্ট স্মার্ট ক্যালকুলেশন
                predictedNum = (lastNum * 2 + secondLast + Math.floor(Math.random() * 4)) % 10;
            }

            // যদি শেষ ১ বা ২টি সিগন্যাল লস হয়ে থাকে, তবে রিকভারি মোড বা ট্রেন্ড রিভার্সাল অ্যাপ্লাই করা হবে
            if (mySignalHistory.length >= 1) {
                let recentLosses = 0;
                for (let i = 0; i < Math.min(2, mySignalHistory.length); i++) {
                    if (mySignalHistory[i].status === 'Loss') {
                        recentLosses++;
                    }
                }

                // যদি পরপর ১ বা ২টি লস দেখা যায়, তবে এআই বা লজিক রিভার্স করে উইন রেট বাড়িয়ে দেবে
                if (recentLosses > 0) {
                    predictedNum = (predictedNum + 5) % 10; // অপজিট ট্রেন্ডে শিফট করা
                }
            }

            currentSignal.number = predictedNum;

            // 0 থেকে 4 = Small, 5 থেকে 9 = Big
            let size = (predictedNum >= 0 && predictedNum <= 4) ? "Small" : "Big";
            currentSignal.size = size;

            signalValue.textContent = size;
            signalValue.style.color = size === "Small" ? "#5bc0de" : "#f0ad4e";
        }

        async function fetchAndCheckResult() {
            if (apiCheckedThisCycle) return;
            apiCheckedThisCycle = true;
            const url = `https://draw.ar-lottery01.com/WinGo/${selectedApiType}/GetHistoryIssuePage.json`;
            
            setTimeout(async () => {
                try {
                    let response = await fetch(url, { headers: { "Origin": "https://dkwin9.com", "Referer": "https://dkwin9.com/" } });
                    let data = await response.json();
                    apiBrainMemory = data.data.list; 
                    
                    let targetResult = apiBrainMemory.find(item => {
                        let p = item.issueNumber || item.gameNo || item.period || '';
                        return String(p) === String(currentSignal.targetFullPeriod);
                    });

                    let isMatch = false;
                    if (targetResult) {
                        let apiNumber = parseInt(targetResult.number);
                        let apiSize = (apiNumber >= 0 && apiNumber <= 4) ? "Small" : "Big";
                        isMatch = (apiSize === currentSignal.size);
                    }

                    let statusText = isMatch ? "Win" : "Loss";
                    
                    applyWinLossUI(isMatch);
                    mySignalHistory.unshift({ period: currentSignal.targetFullPeriod, signal: currentSignal.size, status: statusText });

                    if (document.getElementById('historyModal').style.display === 'flex') {
                        displayMyHistoryTable();
                    }
                    fetchAndUpdateNewPeriod(); 
                } catch (error) {
                    applyWinLossUI(false);
                    mySignalHistory.unshift({ period: currentSignal.targetFullPeriod, signal: currentSignal.size, status: "Loss" });
                    if (document.getElementById('historyModal').style.display === 'flex') {
                        displayMyHistoryTable();
                    }
                }
            }, 1500);
        }

        function applyWinLossUI(isWin) {
            const signalValue = document.getElementById('signalValue');
            document.getElementById('signalBoxTitle').textContent = "STATUS";
            
            if (isWin) {
                signalValue.textContent = "Win";
                signalValue.style.color = "#28a745";
            } else {
                signalValue.textContent = "Loss";
                signalValue.style.color = "#dc3545";
            }
        }
        
        function startTimer(totalSeconds) {
            if (timerInterval) clearInterval(timerInterval);
            const timerDisplay = document.getElementById('timerDisplay');
            const timerBar = document.getElementById('timerBar');

            async function updateDisplay() {
                let now = Math.floor(Date.now() / 1000 + 2); 
                let currentCycle = Math.floor(now / totalSeconds);
                let rawTimeLeft = totalSeconds - (now % totalSeconds);
                let timeLeft = rawTimeLeft === totalSeconds ? 0 : rawTimeLeft;

                if (currentCycle !== lastGeneratedCycle) {
                    lastGeneratedCycle = currentCycle;
                    apiCheckedThisCycle = false;
                    await fetchAndUpdateNewPeriod(); 
                    generateJSSignal(); // শক্তিশালী রিকভারি ও অ্যাডাপ্টিভ লজিক কল করা হলো
                }

                if (timeLeft === 3 || timeLeft === 2) {
                    fetchAndCheckResult();
                }

                let mins = Math.floor(timeLeft / 60);
                let secs = timeLeft % 60;
                let formattedTime = (mins < 10 ? "0" + mins : mins) + ":" + (secs < 10 ? "0" + secs : secs) + "M";

                timerDisplay.textContent = (totalSeconds === 30) ? ((timeLeft < 10 ? "0" : "") + timeLeft + "S") : formattedTime;
                timerBar.style.width = ((timeLeft / totalSeconds) * 100) + "%";
            }

            updateDisplay();
            timerInterval = setInterval(updateDisplay, 1000);
        }

        makeDraggable(document.getElementById('lockPopup'));
        makeDraggable(document.getElementById('fhBall'));
        makeDraggable(document.getElementById('eiBall'));

        let hasMoved = false;
        function makeDraggable(element) {
            let isDragging = false, startX, startY;
            element.addEventListener('mousedown', dragStart);
            document.addEventListener('mousemove', drag);
            document.addEventListener('mouseup', dragEnd);
            element.addEventListener('touchstart', dragStart);
            document.addEventListener('touchmove', drag);
            document.addEventListener('touchend', dragEnd);

            function dragStart(e) {
                isDragging = true; hasMoved = false;
                let clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
                let clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
                startX = clientX - element.offsetLeft;
                startY = clientY - element.offsetTop;
            }
            function drag(e) {
                if (!isDragging) return;
                hasMoved = true;
                let clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
                let clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
                let newX = clientX - startX;
                let newY = clientY - startY;
                let maxX = window.innerWidth - element.offsetWidth;
                let maxY = window.innerHeight - element.offsetHeight;
                newX = Math.max(0, Math.min(newX, maxX));
                newY = Math.max(0, Math.min(newY, maxY));
                element.style.left = newX + 'px';
                element.style.top = newY + 'px';
                element.style.right = 'auto';
            }
            function dragEnd() { isDragging = false; }
        }
    </script>
</body>
    </html>
